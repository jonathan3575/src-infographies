[project]
name = "src-infographies"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "playwright>=1.45",
  "pydantic>=2.7",
  "click>=8.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
